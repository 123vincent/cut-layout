[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cut-layout"
version = "1.0.0"
description = "Plan de coupe imprimable 1:1 (PDF mosaïque) pour patrons Seamly2D (.sm2d + .smis)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VincentB" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "reportlab",   # export PDF 1:1 (choisi contre QPdfWriter : voir export/pdf_common.py)
]

[project.scripts]
cut-layout = "cut_layout.app:main"

[project.optional-dependencies]
dev = ["pytest", "pdfplumber", "babel"]   # pdfplumber : relecture des PDF ; babel : traductions (tools/i18n.py)
build = ["pyinstaller"]  # application autonome : pyinstaller_build.py

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["sm2d_geom"]   # calcul de la géométrie Seamly2D (module de premier niveau)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cut_layout = ["ui/styles/*.qss", "ui/styles/*.svg", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
